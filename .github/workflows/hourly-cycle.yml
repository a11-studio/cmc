name: Hourly agent cycle

# Backup trigger. The primary hourly trigger is Supabase pg_cron at :02
# (supabase/migrations/20261106150000_hourly_cycle_pg_cron.sql); GitHub's schedule
# runs late or not at all. Cycles are claimed per UTC hour, so a second trigger in
# the same hour is skipped as a duplicate.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production agent cycles
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cmc-one-kappa.vercel.app/api/agents/cycle")"
          echo "HTTP status: ${http_code}"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            head -c 2000 "$response_file" || true
            echo ""
          else
            head -c 2000 "$response_file" || true
            exit 1
          fi
